<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, initial-scale=1">
  <title>{{APP_NAME}}</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Everything lives inside the 1920x1080 "stage". It is scaled to fit any TV resolution
       and keeps content inside the 5% overscan-safe area. -->
  <main id="stage">
    <header class="topbar">
      <div>
        <h1 id="greeting">Good evening</h1>
        <p class="subtitle">{{APP_NAME}} &middot; built with vibetv</p>
      </div>
      <div class="clock">
        <span id="time">--:--</span>
        <span id="date"></span>
      </div>
    </header>

    <section>
      <h2 id="row-title">Your apps</h2>
      <!-- Tiles are rendered by app.js. Anything with class "focusable" can be reached with the D-pad. -->
      <div id="tiles" class="row"></div>
    </section>

    <section>
      <h2>Quick actions</h2>
      <div class="row">
        <button class="tile small focusable" data-action="screensaver">Screensaver preview</button>
        <button class="tile small focusable" data-action="theme">Switch theme</button>
        <button class="tile small focusable" data-action="settings">TV settings</button>
      </div>
    </section>

    <footer class="hint">Use the arrow keys / D-pad to move &middot; OK to select &middot; Back to exit</footer>
  </main>

  <!-- Ambient screensaver (also used by the Android Daydream service via ?screensaver=1) -->
  <div id="screensaver" hidden>
    <div class="ss-time" id="ss-time"></div>
    <div class="ss-date" id="ss-date"></div>
  </div>

  <script src="tv.js"></script>
  <script src="app.js"></script>
</body>
</html>
