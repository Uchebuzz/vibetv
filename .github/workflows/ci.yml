name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
      - run: uv pip install -e . pytest
      - run: pytest -q
      - run: vibetv --help

  android-template:
    # Proves the scaffolded Android TV project actually compiles.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: pip install -e .
      - run: vibetv new android-tv "CI Check" --dir /tmp/ci-check --app-id com.vibetv.cicheck
      - run: gradle assembleDebug --no-daemon
        working-directory: /tmp/ci-check
      - uses: actions/upload-artifact@v4
        with:
          name: template-apk
          path: /tmp/ci-check/app/build/outputs/apk/debug/*.apk
