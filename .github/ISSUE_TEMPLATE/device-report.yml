name: Device report
description: Tell us what worked (or didn't) on your TV
labels: [device-report]
body:
  - type: input
    id: device
    attributes:
      label: TV / streamer
      placeholder: e.g. Chromecast with Google TV (4K), Google TV 12
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Android TV / Google TV, Fire TV, Roku, LG webOS, Samsung Tizen, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Commands you ran, output, and what you expected.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: vibetv version
      placeholder: vibetv --version
